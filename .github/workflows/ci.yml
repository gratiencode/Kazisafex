name: Kazisafex CI

on:
  push:
    branches: [master, "appmod/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Security regression guard
        run: ./scripts/security-regression.sh

      - name: Backup restore guard test
        run: ./scripts/test-restore-backup.sh

      - name: Compile and run the full test suite
        # tests.skip=true is the local default; CI must always force the suite.
        run: mvn -B -ntp -Dtests.skip=false test

      - name: Package (no tests, same build as production)
        run: mvn -B -ntp -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  static-analysis:
    name: Static analysis (non-blocking initial baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: SpotBugs (with FindSecBugs)
        # First campaign: report is uploaded, the job is non-blocking until the
        # historical findings are triaged. Do not hide the report.
        run: >
          mvn -B -ntp -DskipTests
          com.github.spotbugs:spotbugs-maven-plugin:4.10.5.0:spotbugs
          -Dspotbugs.effort=Default
          -Dspotbugs.maxHeap=2048
          -Dspotbugs.failOnError=false

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: OWASP dependency check (non-blocking)
        continue-on-error: true
        run: >
          mvn -B -ntp -DskipTests
          org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=11
          -Dformat=HTML

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
